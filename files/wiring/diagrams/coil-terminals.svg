<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" style="color:#111;background:#fff" viewBox="0 0 760 170" role="img" aria-label="Ignition coil: the positive terminal carries the reduced-voltage ignition feed and must not be used; the negative terminal goes to the distributor and is where the tach signal wire connects."><style>text{font-family:"Source Sans 3","Segoe UI",Arial,sans-serif;font-size:13px;fill:#111}.b{font-weight:700}.s{font-size:11.5px;fill:#4a4a4a}.z{font-family:"IBM Plex Mono",Consolas,monospace;font-size:11px;letter-spacing:.08em;fill:#4a4a4a}</style><rect width="760" height="170" fill="#fff"/>
    <g fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="300" y="64" width="160" height="80" rx="14" stroke-width="2"/>
      <rect x="334" y="40" width="14" height="24" rx="2"/>
      <rect x="412" y="40" width="14" height="24" rx="2"/>
      <path d="M426 50C520 60 600 104 716 104" stroke-dasharray="1.5 4" stroke-linecap="round" stroke-width="2"/>
      <path d="M334 48H286"/>
    </g>
    <text x="380" y="110" text-anchor="middle" class="b">Coil</text>
    <text x="341" y="32" text-anchor="middle" class="b">+</text>
    <text x="419" y="32" text-anchor="middle" class="b">−</text>
    <text x="278" y="44" text-anchor="end">+ : ignition feed (resistor wire)</text>
    <text x="278" y="60" text-anchor="end" class="s">don't power the tach from here</text>
    <text x="470" y="30">− : wire to the distributor / Ignitor</text>
    <text x="716" y="126" text-anchor="end" class="s">tach signal, through a firewall grommet</text>
  </svg>