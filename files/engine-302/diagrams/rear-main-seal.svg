<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="780" height="540" fill="#ffffff"/>
  <text x="40" y="44" font-size="24" font-weight="700" fill="#1f2933">Two-Piece Rear Main Seal (289/302)</text>
  <text x="40" y="70" font-size="14" fill="#52606d">Rear face of the engine, looking forward. Seal splits at the crank centerline.</text>

  <!-- Block body (upper) -->
  <rect x="70" y="95" width="360" height="190" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="90" y="120" font-size="13" font-weight="700" fill="#334155">BLOCK</text>

  <!-- Rear main cap (lower) -->
  <path d="M 110 285 L 390 285 L 362 452 L 138 452 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="158" cy="430" r="7" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <circle cx="342" cy="430" r="7" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="196" y="434" font-size="13" font-weight="700" fill="#334155">REAR MAIN CAP</text>

  <!-- Upper seal half (in block) -->
  <path d="M 122 285 A 128 128 0 0 1 378 285 L 350 285 A 100 100 0 0 0 150 285 Z" fill="#475569" stroke="#1f2933" stroke-width="1.5"/>
  <!-- Lower seal half (in cap) -->
  <path d="M 122 285 A 128 128 0 0 0 378 285 L 350 285 A 100 100 0 0 1 150 285 Z" fill="#64748b" stroke="#1f2933" stroke-width="1.5"/>

  <!-- Crank journal -->
  <circle cx="250" cy="285" r="92" fill="#aeb9c7" stroke="#64748b" stroke-width="2"/>
  <text x="250" y="290" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">CRANK</text>

  <!-- Split line at centerline -->
  <line x1="95" y1="285" x2="405" y2="285" stroke="#1f2933" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="250" y="305" font-size="11" fill="#1f2933" text-anchor="middle" font-style="italic">split at crank centerline</text>

  <!-- Parting-line markers -->
  <circle cx="122" cy="285" r="4" fill="#0f766e"/>
  <circle cx="378" cy="285" r="4" fill="#0f766e"/>

  <!-- Chip marker on block rear edge (transmission side) -->
  <path d="M 330 200 l 14 -9 l 3 17 z" fill="#dc2626" stroke="#7f1d1d" stroke-width="1"/>
  <line x1="347" y1="198" x2="470" y2="170" stroke="#dc2626" stroke-width="1.5"/>
  <text x="476" y="160" font-size="13" font-weight="700" fill="#b91c1c">Chip — rear edge of block</text>
  <text x="476" y="180" font-size="12" fill="#52606d">(transmission side). Non-sealing</text>
  <text x="476" y="197" font-size="12" fill="#52606d">unless it reaches the seal</text>
  <text x="476" y="214" font-size="12" fill="#52606d">groove (the OD seating surface).</text>

  <!-- Upper half callout -->
  <line x1="250" y1="168" x2="250" y2="120" stroke="#475569" stroke-width="1.5"/>
  <text x="250" y="112" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Upper seal half — in block</text>

  <!-- Lower half callout -->
  <line x1="250" y1="413" x2="250" y2="470" stroke="#64748b" stroke-width="1.5"/>
  <text x="250" y="486" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle">Lower seal half — in cap</text>

  <!-- Install tips box -->
  <rect x="476" y="250" width="268" height="168" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="492" y="276" font-size="14" font-weight="700" fill="#1f2933">Install notes</text>
  <circle cx="498" cy="300" r="3" fill="#0f766e"/>
  <text x="510" y="304" font-size="12" fill="#334155">Clean ALL old RTV from the bore first.</text>
  <circle cx="498" cy="324" r="3" fill="#0f766e"/>
  <text x="510" y="328" font-size="12" fill="#334155">Sealant on the seal ENDS only; lube lip.</text>
  <circle cx="498" cy="348" r="3" fill="#0f766e"/>
  <text x="510" y="352" font-size="12" fill="#334155">Offset the seal parting lines (green)</text>
  <text x="510" y="368" font-size="12" fill="#334155">from the cap-to-block split.</text>
  <circle cx="498" cy="390" r="3" fill="#0f766e"/>
  <text x="510" y="394" font-size="12" fill="#334155">Crank stays in — rotate upper half</text>
  <text x="510" y="410" font-size="12" fill="#334155">in around the journal.</text>

  <text x="40" y="510" font-size="11" fill="#94a3b8">Schematic, not to scale. 1966 Mustang, 302 / C4. Verify fastener torque against a shop manual.</text>
</svg>
